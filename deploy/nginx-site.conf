# 个人网站 Nginx 站点配置
# 用法：复制到 /etc/nginx/sites-available/personal-site 并建立软链接
# 有域名时把 server_name _ 换成你的域名

server {
    listen 80;
    listen [::]:80;

    # 没有域名时保持 _ 即可（响应所有 Host）
    server_name _;

    # 站点根目录：仓库根目录（VitePress 构建产物已提交到这里）
    root /var/www/personal-site;
    index index.html;

    # VitePress 使用 cleanUrls（/about 对应 about.html），这里做后缀回退
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 静态资源缓存一周
    location ~* \.(css|js|mjs|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 简历 PDF 允许直接下载
    location ~* \.pdf$ {
        expires 1d;
        add_header Content-Disposition "inline";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
