name: Deploy site to GitHub Pages

# 说明：这个工作流需要把仓库 Settings → Pages → Source 设为「GitHub Actions」才会生效。
# 当前该仓库用的是「从分支发布（main / 根目录）」，所以网站是通过根目录里的构建产物发布的，
# 这个工作流暂时只保留为手动触发，避免两套发布方式互相覆盖。
# 以后想切回自动部署：把下面的 workflow_dispatch 保留、加上 push 触发，
# 并在 Settings → Pages 把 Source 改成 GitHub Actions。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史，lastUpdated 才能显示每个页面的真实最后修改时间
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
